# Contrat ML V1. Le test 2025 est déclaré mais jamais chargé par les baselines.
data:
  annual_input: data/processed/dvf/geography/dvf_{year}.parquet

split:
  train_years: [2021, 2022, 2023]
  validation_year: 2024
  test_year: 2025

target: prix_m2
target_transform: log

features:
  numeric:
    - surface_reelle_bati
    - nombre_pieces_principales
    - nombre_lots
    - surface_terrain
  boolean:
    - has_dependance
  categorical:
    - code_type_local
    - code_postal
    - code_departement
    - source_code_commune
    - canonical_commune_code
    - resolved_geo_type
    - region_code
  derived:
    - mutation_year
    - mutation_month
    - surface_terrain_missing
    - geography_unresolved

catboost:
  loss_function: RMSE
  eval_metric: RMSE
  iterations: 3000
  learning_rate: 0.05
  depth: 8
  random_seed: 42
  thread_count: -1
  early_stopping_rounds: 100
  allow_writing_files: false

mlflow:
  tracking_database: mlflow.db
  artifact_directory: mlartifacts
  experiment_name: real-estate-price-v1
  model_artifact_name: model
