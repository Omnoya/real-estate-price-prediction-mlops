name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

  docker:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build serving image
        run: docker build --tag real-estate-api:ci .

      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format='{{.Config.User}}' real-estate-api:ci)" = "app"

      - name: Verify standalone runtime import
        run: >-
          docker run --rm --entrypoint python real-estate-api:ci -c
          "import importlib.util;
          assert importlib.util.find_spec('mlflow') is None;
          import real_estate.api.main;
          print('runtime import ok')"
